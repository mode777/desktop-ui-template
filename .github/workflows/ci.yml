name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run check

      # `npm run check` already built apps/template/dist and apps/minimal/dist,
      # so reuse those outputs instead of building twice. Each step fails the
      # job when that target's gzipped JavaScript grows beyond its own budget
      # file; CSS overage is advisory in this phase.
      - name: Bundle size
        run: npm run size -- --no-build --summary "$GITHUB_STEP_SUMMARY"

      - name: Bundle size (minimal example)
        run: npm run size:minimal -- --no-build --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload size reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: size-report
          path: |
            size-report.json
            size-report.minimal.json
          if-no-files-found: warn
