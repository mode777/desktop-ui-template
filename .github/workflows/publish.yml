name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run check

      - name: Bundle size
        run: npm run size -- --no-build --summary "$GITHUB_STEP_SUMMARY"

      - name: Bundle size (minimal)
        run: npm run size:minimal -- --no-build --summary "$GITHUB_STEP_SUMMARY"

      - name: Verify release tag
        run: npm run check:release-tag -- --tag "$GITHUB_REF_NAME"

      - name: Publish
        working-directory: packages/workbench
        run: npm publish --access public --provenance
